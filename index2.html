<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>CTEC Business Challenge</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}canvas{display:block}#flat{width:100vw;height:100vh;object-fit:contain}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head>
<body><canvas id="flat"></canvas>
<script type="module">
import * as THREE from 'three';
import {VRButton} from 'three/addons/webxr/VRButton.js';

/* ===== DISPLAY CONFIG: edit to match the room's final calibration =====
   yaw = degrees around the room (0 = straight ahead), widthDeg = angular width,
   height/dist/y in metres, safe = fraction of each panel kept clear at edges.
   Projectors 5 and 6 are deliberately absent: nothing is ever rendered for them. */
const CONFIG={W:1280,H:720,safe:0.08,inputPanel:2,
 panels:[{id:1,yaw:-135},{id:2,yaw:-45},{id:3,yaw:45},{id:4,yaw:135}].map(p=>({widthDeg:90,height:3.4,dist:3,y:0,...p}))};
const W=CONFIG.W,H=CONFIG.H,sx=W*CONFIG.safe,sy=H*CONFIG.safe,cw=W-2*sx;

/* ===== CONTENT: teacher-editable scenarios and rounds ===== */
const SC=[{n:'Campus Café',p:'coffees and snacks',c:'students and commuters'},{n:'Street Sneakers',p:'trainers',c:'teens and young adults'},{n:'Fix-It Phones',p:'phone repairs',c:'students and local workers'},{n:'Pop-Up Events',p:'event tickets',c:'local young people'}];
const DIF=[{n:'Easy',cash:12000,neg:.7,t:90},{n:'Standard',cash:10000,neg:1,t:60},{n:'Hard',cash:8000,neg:1.3,t:40}];
// option = [label, detail, cash, reputation, demand, why]
const R=[
{k:'Customer needs & target market',s:'You have launched {b}. Money is tight, so you must choose a main target market for your {p}.',q:'What evidence would show what customers really want?',o:[
['Sell to everyone','Broad message, no research',-300,0,5,'Serving everyone dilutes your message. Focused markets are cheaper to reach and easier to satisfy.'],
['Survey {c}','Short survey, then focus on their needs',-500,10,15,'Research costs a little now but shows real needs, so product and promotion fit the target market.'],
['Copy the biggest rival','Same products, same style',0,-5,5,'Copying gives customers no reason to choose you. A clear unique selling point beats imitation.']]},
{k:'Pricing & promotion',s:'Launch week. You must set prices and decide how to tell {c} about {b}.',q:'Which promotion method reaches your target market at the lowest cost?',o:[
['Lowest price, no promotion','Undercut everyone',600,-5,5,'Low prices shrink your margin, and with no promotion few people know you exist.'],
['Fair price + social campaign','£400 on targeted ads',1800,5,15,'Pricing for value and promoting where your market spends time earns sales above cost.'],
['Premium price + billboards','£1,500 on big adverts',-200,5,0,'Premium pricing needs proof of value, and broad advertising can cost more than it earns.']]},
{k:'Costs, revenue & cash flow',s:'Time to restock. Your supplier choice affects costs and how much cash you hold.',q:'Why can a profitable business still run out of cash?',o:[
['Supplier A','£2.00 per item, pay on delivery',900,0,5,'Higher cost per item, but cash is not tied up. Safe, but margins stay smaller.'],
['Supplier B bulk order','£1.60 per item, pay in 60 days, huge order',-800,0,10,'Lower unit cost lifts profit per sale, but big orders strain cash flow before customers pay.'],
['Supplier C','£1.80 per item, 30 days credit, small orders',1500,5,10,'Credit terms plus modest orders balance cost and cash flow. Profit on paper is not cash in the bank.']]},
{k:'Operations & resources',s:'A local event doubles demand this Saturday. You have two staff and limited stock.',q:'Which resource is the biggest limit: people, stock, time or money?',o:[
['Hire temporary staff','£600 for the weekend',1200,10,20,'Spending to meet peak demand protects sales and service quality.'],
['Run with the current team','Everyone works harder',900,-10,-5,'Saves wages, but queues and mistakes harm reputation.'],
['Limit opening hours','Serve fewer customers',300,-5,-15,'You avoid stress but turn away revenue and customers.']]},
{k:'Risk & changing conditions',s:'A rival opens next door and your costs rise 10%. How do you respond?',q:'Which risks could you have planned for earlier?',o:[
['Start a price war','Match their price cuts',-600,-5,10,'Price wars squeeze margins for everyone, especially when your own costs are rising.'],
['Loyalty rewards + service','Reward repeat customers',700,15,10,'Competing on service and loyalty keeps customers without cutting price.'],
['Ignore it','Hope it blows over',-400,-10,-15,'Failing to respond to change risks losing customers. Monitor risks and plan responses.']]}];
const DEB=['Which decision had the biggest effect, and what evidence supported it?','Where did your team disagree, and how did you settle it?','What trade-off between cash, reputation and demand was hardest?','What would you do differently with the same budget?','Which skills did your team use best: communication, budgeting, planning, adapting?'];

/* ===== STATE ===== */
const S={ph:'welcome',sc:0,nr:4,df:1,tm:1,r:0,sel:null,t:60,pause:false,cash:0,rep:50,dem:50,hist:[],last:null,ids:[],calib:false};
const cl=v=>Math.max(0,Math.min(100,v)),sub=s=>s.replace(/{b}/g,SC[S.sc].n).replace(/{p}/g,SC[S.sc].p).replace(/{c}/g,SC[S.sc].c);
const team=()=>S.tm==1?'Whole room':'Team '+'ABC'[S.r%S.tm];
const rd=()=>R[S.ids[S.r]],ready=()=>S.t<=0;
function start(){const d=DIF[S.df];Object.assign(S,{ph:'round',r:0,sel:null,t:d.t,pause:false,cash:d.cash,rep:50,dem:50,hist:[d.cash],last:null,ids:S.nr==5?[0,1,2,3,4]:S.nr==4?[0,1,3,4]:[0,1,4]})}
function lock(){if(S.sel==null||!ready())return;const o=rd().o[S.sel],n=DIF[S.df].neg,f=v=>Math.round(v<0?v*n:v);const dc=f(o[2]),dr=f(o[3]),dd=f(o[4]);S.cash+=dc;S.rep=cl(S.rep+dr);S.dem=cl(S.dem+dd);S.hist.push(S.cash);S.last={o,dc,dr,dd};S.ph='outcome'}
function next(){S.r++;if(S.r>=S.ids.length)S.ph='summary';else{S.ph='round';S.sel=null;S.t=DIF[S.df].t}}
const primary=()=>({welcome:start,setup:start,round:lock,outcome:next,summary:()=>S.ph='debrief',debrief:()=>S.ph='welcome'}[S.ph])();
setInterval(()=>{if(S.ph==='round'&&!S.pause&&S.t>0)S.t--},1000);
const score=()=>Math.round(cl(S.cash/DIF[S.df].cash*40+S.rep*.3+S.dem*.3));

/* ===== DRAWING ===== */
const hs=n=>{const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)};
const rr=(x,a,b,w,h,r,f)=>{x.beginPath();x.roundRect(a,b,w,h,r);x.fillStyle=f;x.fill()};
function tx(x,s,a,b,sz,col='#fff',w=cw,bold=0,al='left'){x.font=(bold?'700 ':'500 ')+sz+'px system-ui,sans-serif';x.fillStyle=col;x.textBaseline='top';x.textAlign=al;let l='',y=b;for(const wd of s.split(' ')){const t=l?l+' '+wd:wd;if(x.measureText(t).width>w&&l){x.fillText(l,a,y);y+=sz*1.3;l=wd}else l=t}x.fillText(l,a,y);return y+sz*1.3}
function bg(x,i){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1230');g.addColorStop(1,'#1d2d5c');x.fillStyle=g;x.fillRect(0,0,W,H);const lit=(S.rep+S.dem)/200;
 for(let k=0;k<24;k++){const b=Math.floor(i*W/58)+k,px=b*58-i*W,hh=120+hs(b)*230;x.fillStyle='#080d1f';x.fillRect(px,H-hh,56,hh);for(let wy=H-hh+10;wy<H-10;wy+=26)for(let wx=6;wx<50;wx+=16){x.fillStyle=hs(b*31+wy*7+wx)<lit*.9?'#ffd166':'#141c3a';x.fillRect(px+wx,wy,8,12)}}
 rr(x,sx-12,sy-12,cw+24,H-2*sy+24,24,'rgba(6,10,26,.88)')}
const bar=(x,l,v,a,b,w,c)=>{tx(x,l+' '+v,a,b,30,'#cfe3ff',w);rr(x,a,b+42,w,22,11,'#26304f');rr(x,a,b+42,Math.max(8,w*v/100),22,11,c)};
let B=[];
function btn(x,l,a,b,w,h,fn,o={}){const on=o.on!==false;B.push(on?{a,b,w,h,fn}:{a:0,b:0,w:0,h:0});rr(x,a,b,w,h,14,!on?'#2a2f45':o.sel?'#4cc9f0':'#1f3a8a');
 tx(x,l,a+(o.al=='c'?w/2:18),b+(o.d?10:h/2-(o.sz||30)/2-2),o.sz||30,!on?'#7d86a8':o.sel?'#04121f':'#fff',w-30,1,o.al=='c'?'center':'left');if(o.d)tx(x,o.d,a+18,b+52,24,o.sel?'#04121f':'#bcd0ff',w-36)}
const spin=(x,l,v,a,b,m,p)=>{tx(x,l,a,b+8,30,'#cfe3ff',250);btn(x,'◄',a+270,b,70,54,m,{al:'c'});tx(x,v,a+450,b+8,30,'#fff',280,1,'center');btn(x,'►',a+600,b,70,54,p,{al:'c'})};

function p1(x){bg(x,0);tx(x,'BUSINESS SITUATION',sx,sy,26,'#4cc9f0',cw,1);const sc=SC[S.sc];
 if(S.ph==='welcome'||S.ph==='setup'){tx(x,sc.n,sx,sy+50,64,'#fff',cw,1);tx(x,`You have an idea, a small budget and a market of ${sc.c}. Over ${S.nr} rounds your team will run ${sc.n}: choose wisely, explain your reasoning and watch the room respond.`,sx,sy+150,36)}
 else if(S.ph==='debrief'){tx(x,'DEBRIEF: DISCUSS AS A TEAM',sx,sy+50,44,'#fff',cw,1);let y=sy+120;DEB.slice(0,3).forEach((q,i)=>y=tx(x,(i+1)+'. '+q,sx,y+8,32)+10)}
 else if(S.ph==='summary'){tx(x,'Trading period complete',sx,sy+50,56,'#fff',cw,1);tx(x,`${SC[S.sc].n} ran for ${S.ids.length} rounds. Look at the dashboard to see how your decisions added up.`,sx,sy+140,36)}
 else{const r=rd();tx(x,`ROUND ${S.r+1} OF ${S.ids.length}  ·  ${r.k.toUpperCase()}`,sx,sy+40,28,'#ffb703',cw,1);tx(x,sub(r.s),sx,sy+100,42,'#fff',cw,1)}}
function p2(x){bg(x,1);B=[];tx(x,'CONTROLS  ·  PROJECTOR 2',sx,sy,24,'#4cc9f0',cw,1);const fy=H-sy-50,mid=sx+cw/2;
 if(S.ph==='welcome'){tx(x,'CTEC Business Challenge',sx,sy+40,60,'#fff',cw,1);tx(x,'Build, run and grow a small business. Discuss every decision as a team.',sx,sy+120,32);btn(x,'Start game  [Enter]',sx,sy+240,cw,90,start,{al:'c',sz:38});btn(x,'Teacher settings  [T]',sx,sy+350,cw,70,()=>S.ph='setup',{al:'c'})}
 else if(S.ph==='setup'){tx(x,'Teacher settings',sx,sy+30,44,'#fff',cw,1);const a=sx;
  spin(x,'Scenario',SC[S.sc].n,a,sy+100,()=>S.sc=(S.sc+3)%4,()=>S.sc=(S.sc+1)%4);
  spin(x,'Rounds',S.nr,a,sy+170,()=>S.nr=Math.max(3,S.nr-1),()=>S.nr=Math.min(5,S.nr+1));
  spin(x,'Difficulty',DIF[S.df].n,a,sy+240,()=>S.df=(S.df+2)%3,()=>S.df=(S.df+1)%3);
  spin(x,'Teams',S.tm==1?'Whole room':S.tm+' teams',a,sy+310,()=>S.tm=Math.max(1,S.tm-1),()=>S.tm=Math.min(3,S.tm+1));
  btn(x,'Start game',a,sy+390,cw,80,start,{al:'c',sz:36})}
 else if(S.ph==='round'){const r=rd();tx(x,`Deciding: ${team()}`,sx,sy+30,34,'#ffb703',500,1);
  tx(x,ready()?'Discussion over: choose and lock in':'Discuss: '+S.t+'s',sx+cw-480,sy+30,32,ready()?'#7cf29a':'#fff',480,1,'right');
  r.o.forEach((o,i)=>btn(x,`${i+1}.  ${sub(o[0])}`,sx,sy+80+i*108,cw,98,()=>S.sel=i,{sel:S.sel===i,d:sub(o[1])}));
  btn(x,S.sel==null?'Pick an option':ready()?'Lock in decision  [Enter]':'Keep discussing…',sx,sy+410,cw,70,lock,{on:S.sel!=null&&ready(),al:'c',sz:34})}
 else if(S.ph==='outcome'){tx(x,'Result recorded: see Projectors 3 and 4',sx,sy+60,40,'#fff',cw,1);btn(x,S.r+1>=S.ids.length?'See final results  [Enter]':'Next round  [Enter]',sx,sy+200,cw,100,next,{al:'c',sz:38})}
 else if(S.ph==='summary'){tx(x,'Final results are on Projector 3',sx,sy+60,40,'#fff',cw,1);btn(x,'Start debrief  [Enter]',sx,sy+200,cw,100,()=>S.ph='debrief',{al:'c',sz:38})}
 else{tx(x,'Debrief in progress',sx,sy+60,40,'#fff',cw,1);btn(x,'Back to start  [Enter]',sx,sy+200,cw,100,()=>S.ph='welcome',{al:'c',sz:38})}
 const fb=[['Restart',()=>S.ph='welcome'],[S.pause?'Resume':'Pause',()=>S.pause=!S.pause],['Skip timer',()=>S.t=0]];fb.forEach((f,i)=>btn(x,f[0],sx+i*(cw/3),fy,cw/3-10,50,f[1],{al:'c',sz:26}))}
function p3(x){bg(x,2);tx(x,'BUSINESS PERFORMANCE',sx,sy,26,'#4cc9f0',cw,1);
 tx(x,'£'+S.cash.toLocaleString(),sx,sy+36,80,S.cash>=DIF[S.df].cash?'#7cf29a':'#ffb703',cw,1);tx(x,'cash in the bank',sx,sy+130,28,'#cfe3ff');
 bar(x,'Reputation',S.rep,sx,sy+180,cw,'#4cc9f0');bar(x,'Customer demand',S.dem,sx,sy+260,cw,'#ffb703');
 const gy=sy+350,gh=150;x.strokeStyle='#4cc9f0';x.lineWidth=5;x.beginPath();const mx=Math.max(...S.hist,1),n=Math.max(S.hist.length-1,1);S.hist.forEach((v,i)=>{const px=sx+i/n*cw*.98,py=gy+gh-v/mx*gh*.9;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();tx(x,'Cash by round',sx,gy+gh+6,24,'#9fb4e8');
 if(S.ph==='summary'||S.ph==='debrief'){const s=score();tx(x,`Score ${s}/100 · ${s>=75?'Thriving':s>=55?'Growing':'Struggling'}`,sx+cw,sy+36,40,'#fff',500,1,'right')}}
function p4(x){bg(x,3);tx(x,S.ph==='debrief'?'DEBRIEF CONTINUED':S.ph==='outcome'?'WHAT HAPPENED':'THINK & TALK',sx,sy,26,'#4cc9f0',cw,1);
 if(S.ph==='round'){tx(x,rd().q,sx,sy+50,40,'#fff',cw,1);tx(x,'Discuss in your team, then make your choice on Projector 2.',sx,sy+260,32,'#ffb703')}
 else if(S.ph==='outcome'){const l=S.last,f=v=>(v>0?'+':'')+v;tx(x,sub(l.o[0]),sx,sy+40,40,'#fff',cw,1);tx(x,`Cash ${l.dc<0?'-£'+(-l.dc):'+£'+l.dc}   Reputation ${f(l.dr)}   Demand ${f(l.dd)}`,sx,sy+110,32,'#ffb703',cw,1);tx(x,'Why: '+l.o[5],sx,sy+180,34)}
 else if(S.ph==='summary'){tx(x,'Skills practised',sx,sy+40,40,'#fff',cw,1);tx(x,'Customer needs · Pricing and promotion · Cash flow · Operations · Risk · Teamwork and justification',sx,sy+110,34)}
 else if(S.ph==='debrief'){let y=sy+50;DEB.slice(3).forEach((q,i)=>y=tx(x,(i+4)+'. '+q,sx,y+8,34)+10)}
 else tx(x,'Learners: explain your reasoning aloud before every decision.',sx,sy+50,40,'#fff',cw,1)}
const draw=[p1,p2,p3,p4];

/* ===== PANELS (Projectors 1-4 only) ===== */
const P=CONFIG.panels.map(p=>{const c=document.createElement('canvas');c.width=W;c.height=H;return{...p,c,x:c.getContext('2d')}});
function render(){P.forEach((p,i)=>{draw[p.id-1](p.x);if(S.calib){const x=p.x;x.strokeStyle='#f0f';x.lineWidth=4;x.strokeRect(sx,sy,cw,H-2*sy);tx(x,p.id==CONFIG.inputPanel?`P${p.id}: INPUT GUI`:`P${p.id}: NO INPUT`,W/2,H/2-60,44,'#f0f',cw,1,'center')}});
 if(tex)tex.forEach(t=>t.needsUpdate=true);if(flat)drawFlat()}
setInterval(render,250);
function press(px,py){const b=B.find(b=>px>=b.a&&px<=b.a+b.w&&py>=b.b&&py<=b.b+b.h);if(b){b.fn();render()}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(S.ph==='round'&&'123'.includes(k)&&k)S.sel=+k-1;else if(k==='enter'||k===' ')primary();else if(k==='p')S.pause=!S.pause;else if(k==='s')S.t=0;else if(k==='t')S.ph='setup';else if(k==='c')S.calib=!S.calib;else if(k==='r')S.ph='welcome';render()});

/* ===== OUTPUT: 3D WebXR room, or flat room-map fallback ===== */
let tex=null,flat=null,fc=document.getElementById('flat');
function drawFlat(){const x=flat,w=W/2,h=H/2;x.fillStyle='#000';x.fillRect(0,0,fc.width,fc.height);P.forEach((p,i)=>x.drawImage(p.c,i*w,0,w,h))} // bottom row (Projectors 5 and 6) stays black
function startFlat(){fc.width=W*2;fc.height=H;flat=fc.getContext('2d');fc.onclick=e=>{const r=fc.getBoundingClientRect(),s=Math.min(r.width/fc.width,r.height/fc.height),ox=(r.width-fc.width*s)/2,oy=(r.height-fc.height*s)/2,u=(e.clientX-r.left-ox)/s,v=(e.clientY-r.top-oy)/s,i=CONFIG.inputPanel-1;if(u>=i*W/2&&u<(i+1)*W/2&&v<H/2)press((u-i*W/2)*2,v*2)};render()}
function start3D(){fc.remove();const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.xr.enabled=true;r.xr.setReferenceSpaceType('local');document.body.append(r.domElement,VRButton.createButton(r));
 const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,50);sc.background=new THREE.Color(0);const meshes=[];tex=[];
 P.forEach(p=>{const t=new THREE.CanvasTexture(p.c);t.colorSpace=THREE.SRGBColorSpace;tex.push(t);const w=2*p.dist*Math.tan(p.widthDeg*Math.PI/360),m=new THREE.Mesh(new THREE.PlaneGeometry(w,p.height),new THREE.MeshBasicMaterial({map:t}));const a=p.yaw*Math.PI/180;m.position.set(Math.sin(a)*p.dist,p.y,-Math.cos(a)*p.dist);m.rotation.y=-a;m.userData.id=p.id;sc.add(m);meshes.push(m)});
 const ray=new THREE.Raycaster(),hit=()=>{const h=ray.intersectObjects(meshes)[0];if(h&&h.object.userData.id==CONFIG.inputPanel)press(h.uv.x*W,(1-h.uv.y)*H)};
 r.domElement.onclick=e=>{ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight*2-1)),cam);hit()};
 [0,1].forEach(i=>{const c=r.xr.getController(i);c.addEventListener('select',()=>{ray.ray.origin.setFromMatrixPosition(c.matrixWorld);ray.ray.direction.set(0,0,-1).transformDirection(c.matrixWorld);hit()});sc.add(c)});
 addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
 r.setAnimationLoop(()=>r.render(sc,cam));render()}
(navigator.xr?navigator.xr.isSessionSupported('immersive-vr').catch(()=>false):Promise.resolve(false)).then(ok=>ok||location.hash.includes('3d')?start3D():startFlat());
</script></body></html>
